site_name: Tauren Resto Druid — WoW Forever
site_description: >-
  Leveling reference for a Horde Tauren Restoration Druid in World of Warcraft:
  Forever, covering levels 1 to 30.
site_url: https://christofferbraun.github.io/wow-forever-druid/
repo_url: https://github.com/christofferbraun/wow-forever-druid
repo_name: wow-forever-druid

docs_dir: docs
site_dir: _site

theme:
  name: material
  icon:
    logo: material/leaf
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
    - search.share

nav:
  - Overview: index.md
  - 1. What Changed in Forever: forever-vs-classic.md
  - 2. Spells and Abilities: druid-kit.md
  - 3. Spell Rotations: rotations.md
  - 4. Talent Builds: talents.md
  - 5. Leveling Routes: route.md
  - 6. Travel and Flight Paths: travel.md
  - 7. Dungeons: dungeons.md
  - 8. Dungeon Quests: dungeon-quests.md
  - 9. Gear and Loot: gear.md
  - 10. Level Breakpoints: breakpoints.md
  - 11. Open Questions: open-questions.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/christofferbraun/wow-forever-druid
      name: Source on GitHub

